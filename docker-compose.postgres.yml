version: '3.8'

services:
  db:
    image: postgres:15
    container_name: vfinance_postgres
    environment:
      POSTGRES_USER: vfinance
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: vfinance_dev
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vfinance -d vfinance_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
